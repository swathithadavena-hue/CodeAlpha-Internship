<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h1>Image Gallery</h1>

    <!-- Filter Buttons -->

    <div class="buttons">
      <button class="active" onclick="filterImages('all')">All</button>

      <button onclick="filterImages('nature')">Nature</button>

      <button onclick="filterImages('city')">City</button>

      <button onclick="filterImages('animals')">Animals</button>
    </div>

    <!-- Image Gallery -->

    <div class="gallery">
      <div class="image nature">
        <img src="image.jpg" onclick="openLightbox(1)" />
      </div>
      <div class="image nature">
        <img src="img 3.jpg" onclick="openLightbox(2)" />
      </div>
      <div class="image nature">
        <img src="nature.jpg" onclick="openLightbox(3)" />
      </div>
      <div class="image nature">
        <img src="nature 2.webp" onclick="openLightbox(4)" />
      </div>
      <div class="image nature">
        <img src="nature 3.webp" onclick="openLightbox(5)" />
      </div>
      <div class="image nature">
        <img src="nature 4.jpg" onclick="openLightbox(6)" />
      </div>

      <div class="image city">
        <img src="city 1.jpg" onclick="openLightbox(7)" />
      </div>
      <div class="image city">
        <img src="city 2.jpg" onclick="openLightbox(8)" />
      </div>
      <div class="image city">
        <img src="city 3.jpg" onclick="openLightbox(9)" />
      </div>

      <div class="image animals">
        <img src="animal 3.jpg" onclick="openLightbox(10)" />
      </div>
      <div class="image animals">
        <img src="animal 4.jpg" onclick="openLightbox(11)" />
      </div>
      <div class="image animals">
        <img src="animal.jpg" onclick="openLightbox(12)" />
      </div>
    </div>

    <!-- Lightbox -->

    <div id="lightbox">
      <span class="close" onclick="closeLightbox()">&times;</span>

      <button class="prev" onclick="changeImage(-1)">❮</button>

      <img id="lightbox-image" />

      <button class="next" onclick="changeImage(1)">❯</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
